name: ABCF Enforcement Monitor

# Opens a weekly tracking Issue prompting a manual sweep of the primary
# enforcement sources (DOJ, SEC, SFO, OFAC, BIS) for new ABCF-relevant actions.
# This is a scaffolding workflow: it structures the review cadence. It does NOT
# scrape or assert enforcement facts automatically — every logged item must be
# verified against a primary source by a human contributor before it is treated
# as fact (see CONTRIBUTING.md).

on:
  schedule:
    # 07:00 UTC every Monday
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  open-tracking-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Open weekly enforcement-tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const iso = now.toISOString().slice(0, 10);

            // ISO week number
            const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
            const dayNum = (d.getUTCDay() + 6) % 7;
            d.setUTCDate(d.getUTCDate() - dayNum + 3);
            const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
            const week = 1 + Math.round(
              ((d - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7
            );
            const title = `ABCF enforcement sweep — ${now.getUTCFullYear()}-W${String(week).padStart(2, "0")} (opened ${iso})`;

            const body = [
              `Automated weekly tracking issue. Review each primary source for new`,
              `ABCF-relevant activity and record findings below. **Verify every item`,
              `against its primary source before treating it as fact** (CONTRIBUTING.md).`,
              ``,
              `### Sources to sweep`,
              `- [ ] DOJ — FCPA & Fraud Section press releases (justice.gov/criminal/criminal-fraud)`,
              `- [ ] SEC — FCPA enforcement actions & administrative orders (sec.gov/enforcement-litigation)`,
              `- [ ] SFO (UK) — news & DPA announcements (sfo.gov.uk)`,
              `- [ ] FCA (UK) — enforcement notices (fca.org.uk)`,
              `- [ ] OFAC — recent designations & enforcement (ofac.treasury.gov)`,
              `- [ ] BIS — Entity List & export enforcement (bis.gov)`,
              `- [ ] UAE / DFSA — regulatory notices (dfsa.ae)`,
              `- [ ] Sectoral: EITI, ICMM, ISO 37001 news`,
              ``,
              `### New actions / guidance found`,
              `| Date | Authority | Entity | Statute / basis | Sector | Amount | Source URL |`,
              `|------|-----------|--------|-----------------|--------|--------|------------|`,
              `|      |           |        |                 |        |        |            |`,
              ``,
              `### Follow-ups`,
              `- [ ] Add verified items to the relevant \`case-studies/\` or \`frameworks/\` file`,
              `- [ ] Update \`risk-tools/\` if a new red-flag pattern emerged`,
              `- [ ] Note any commonly-misattributed matter in \`case-studies/README.md\``,
              ``,
              `_Generated by \`.github/workflows/fcpa-sec-monitor.yml\`._`,
            ].join("\n");

            const labels = ["enforcement-monitoring", "automated"];

            // Ensure labels exist (ignore errors if they already do).
            for (const name of labels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
              } catch (e) {
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo, name,
                    color: name === "automated" ? "ededed" : "b60205",
                    description: name === "automated"
                      ? "Opened by a scheduled workflow"
                      : "Weekly ABCF enforcement sweep",
                  });
                } catch (_) { /* label may have been created concurrently */ }
              }
            }

            await github.rest.issues.create({
              ...context.repo,
              title,
              body,
              labels,
            });
