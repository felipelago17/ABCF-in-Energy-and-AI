name: ABCF Daily Monitor

# Daily ABCF regulatory sweep (insider trading + anti-bribery/corruption + fraud)
# across the Federal Register API, SEC/DOJ/SFO feeds, and law-firm commentary.
#
# ZERO-COST by default: LLM_PROVIDER=github uses GitHub Models with the built-in
# GITHUB_TOKEN (needs `permissions: models: read`) — no external API credits and
# no new secrets. Alternatives: gemini / groq (free tiers, own secret), anthropic
# (paid), or none (keyword-only). See insider-trading/README.md → "Running for free".
#
# The monitor degrades gracefully — a missing key/quota (HTTP 429) falls back to
# keyword-only classification and never fails the run. AI output is NEVER treated
# as fact (items flagged needs_review; see CONTRIBUTING.md).

on:
  schedule:
    # 04:00 UTC daily == 08:00 Gulf Standard Time (UTC+4).
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Override LLM_PROVIDER for this run (github | gemini | groq | anthropic | none)"
        required: false
        default: ""
      selftest:
        description: "Run provider self-test on fixtures (no digest/commit) to verify the LLM works"
        type: boolean
        required: false
        default: false

permissions:
  models: read       # GitHub Models access for the built-in GITHUB_TOKEN
  contents: write     # commit the dated digest
  issues: write       # open abcf-alert issues

concurrency:
  group: abcf-daily-monitor
  cancel-in-progress: false

jobs:
  daily-monitor:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ${{ github.event.inputs.provider || vars.LLM_PROVIDER || 'github' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
      FEED_USER_AGENT: ${{ vars.FEED_USER_AGENT || 'ABCF-Governance-Monitor/1.0 (+https://github.com/felipelago17/ABCF-in-Energy-and-AI; compliance research)' }}
      SEC_FEEDS: ${{ vars.SEC_FEEDS }}
      DOJ_FEEDS: ${{ vars.DOJ_FEEDS }}
      SFO_FEEDS: ${{ vars.SFO_FEEDS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai feedparser requests pyyaml
          if [ "$LLM_PROVIDER" = "gemini" ]; then
            pip install google-generativeai
          fi

      - name: Run ABCF daily monitor
        id: monitor
        env:
          ABCF_SELFTEST: ${{ github.event.inputs.selftest == 'true' && '1' || '' }}
        run: python scripts/abcf_monitor.py

      - name: Open issues for high-relevance alerts
        if: steps.monitor.outputs.has_alerts == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let payload = { alerts: [] };
            try { payload = JSON.parse(fs.readFileSync('abcf_daily_alerts.json', 'utf8')); }
            catch (e) { core.warning('no alerts file: ' + e.message); return; }

            const banner = '> ⚠️ **AUTO-GENERATED RESEARCH LEAD — NOT VERIFIED.** ' +
              'Confirm every field against the linked primary source before ' +
              'treating it as fact (see CONTRIBUTING.md).\n\n';
            const catLabel = {
              'anti-bribery-corruption': 'anti-bribery-corruption',
              'insider-trading': 'insider-trading',
              'fraud-other': 'fraud',
            };

            async function ensureLabel(name, color) {
              try { await github.rest.issues.getLabel({ ...context.repo, name }); }
              catch (e) {
                try { await github.rest.issues.createLabel({ ...context.repo, name, color }); }
                catch (_) {}
              }
            }

            for (const a of (payload.alerts || [])) {
              const cat = catLabel[a.category] || 'fraud';
              const labels = ['abcf-alert', cat];
              if (a.insider_fact_pattern) labels.push(a.insider_fact_pattern);
              if (a.uae_gcc_nexus) labels.push('uae-gcc-nexus');
              if (a.section_17a) labels.push('section-17a');
              for (const name of labels) await ensureLabel(name, 'b60205');

              const bullets = (a.bullets || []).map(b => `- ${b}`).join('\n');
              const flags = [
                a.extraterritorial ? 'extraterritorial' : null,
                a.uae_gcc_nexus ? 'UAE/GCC nexus' : null,
                a.insider_fact_pattern ? `pattern: ${a.insider_fact_pattern}` : null,
                a.section_17a ? '§17(a) theory' : null,
              ].filter(Boolean).join(' · ') || 'none';

              const title = `[ABCF-ALERT] ${a.title}`.slice(0, 240);
              const body = banner +
                `**Source:** ${a.source} (${a.agency || 'n/a'})\n` +
                `**Category:** ${a.category}\n` +
                `**Relevance:** ${a.relevance} — energy ${a.energy_relevance}/5, AI ${a.ai_relevance}/5\n` +
                `**Classified via:** ${a.method}\n` +
                `**Flags:** ${flags}\n\n` +
                (bullets ? bullets + '\n\n' : '') +
                `**Link:** ${a.link || 'n/a'}\n`;

              await github.rest.issues.create({ ...context.repo, title, body, labels });
            }

      - name: Commit dated digest
        run: |
          git config user.name "abcf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insider-trading/digests/*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No digest changes to commit."
            exit 0
          fi
          git commit -m "chore: ABCF daily digest ($(date -u +%Y-%m-%d))"
          # Retry with rebase to survive a concurrent push to the same branch.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed digest."
              exit 0
            fi
            echo "Push rejected (attempt $i) — rebasing on origin/${GITHUB_REF_NAME} and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done
          echo "Push failed after retries." >&2
          exit 1
